name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  checks: write
  contents: read

jobs:
  unit:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npx vitest run --reporter=junit --outputFile=results/unit.xml

      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: results/unit.xml
          reporter: java-junit

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true
          # Dummy key prevents GoogleGenAI constructor from throwing synchronously.
          # The subsequent API call fails with an auth error, caught gracefully in geminiService.ts.
          GEMINI_API_KEY: placeholder-key-ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
